name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    name: Windows portable app and installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows app and installers
        run: npx tauri build --bundles nsis,msi

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: agent-buddy-workbuddy-windows-portable
          path: src-tauri/target/release/agent-buddy-workbuddy.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: agent-buddy-workbuddy-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: agent-buddy-workbuddy-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
