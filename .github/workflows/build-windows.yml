name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    name: Windows portable app and installers
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows app and installers
        run: npx tauri build --bundles nsis,msi

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/agent-buddy-workbuddy.exe release/Agent-Buddy-WorkBuddy-Portable.exe
          Compress-Archive -Path release/Agent-Buddy-WorkBuddy-Portable.exe -DestinationPath release/Agent-Buddy-WorkBuddy-Portable.zip -Force
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "release/$($_.Name)"
          }
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            Copy-Item $_.FullName "release/$($_.Name)"
          }

      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          gh release create $tag release/* `
            --repo "${{ github.repository }}" `
            --title "Agent Buddy WorkBuddy Windows build ${{ github.run_number }}" `
            --notes "Private test build. Recommended file: Agent-Buddy-WorkBuddy-Portable.zip. Unsigned build; Windows SmartScreen may warn." `
            --prerelease
