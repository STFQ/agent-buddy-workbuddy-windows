name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    name: Windows portable app
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, verify, and package desktop client
        shell: pwsh
        run: ./scripts/package-desktop-client.ps1

      - name: Verify release tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} must match package.json version v$version."
          }

      - name: Upload verified portable package
        uses: actions/upload-artifact@v4
        with:
          name: agent-buddy-workbuddy-windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish public release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download verified portable package
        uses: actions/download-artifact@v4
        with:
          name: agent-buddy-workbuddy-windows-${{ github.sha }}
          path: release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $recommended = (Get-ChildItem release -Filter "Agent-Buddy-WorkBuddy-Windows-v*.zip" | Select-Object -First 1).Name
          gh release create "${{ github.ref_name }}" release/* `
            --repo "${{ github.repository }}" `
            --title "Agent Buddy for WorkBuddy ${{ github.ref_name }}" `
            --notes "Windows release. Recommended file: $recommended. Unsigned builds can trigger a Microsoft SmartScreen warning." `
            --latest
